<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Visualizador</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #04060b; color: #e9e2d4; font-family: "VT323", ui-monospace, monospace; }
    main { min-height: 100%; display: grid; place-content: center; gap: 18px; padding: 24px; }
    a { color: #e9e2d4; text-decoration: none; font-size: 34px; letter-spacing: .06em; border-bottom: 1px solid rgba(233,226,212,.25); padding-bottom: 2px; }
    a:hover { border-color: #9fe0d6; color: #9fe0d6; }
  </style>
</head>
<body>
  <main>
    <a href="sonar/">sonar</a>
    <a href="sonar-v2/">sonar v2</a>
    <a href="sonar-v3/">sonar v3</a>
    <a href="archipielago/">archipiélago</a>
    <a href="bosque/">bosque</a>
    <a href="bosque-maqueta/">bosque maqueta</a>
    <a href="caja-de-musica/">caja de música</a>
  </main>
</body>
</html>

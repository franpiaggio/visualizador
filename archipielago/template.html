<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Archipiélago — Strudel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="relief"></canvas>
  <canvas id="map"></canvas>
  <canvas id="paper"></canvas>

  <!-- el editor real queda guardado (Shift+C lo muestra); suena desde acá -->
  <section id="code" aria-label="Código Strudel en ejecución">
    <strudel-editor><!--
{{CODE}}
--></strudel-editor>
  </section>

  <!-- un click antes de que cargue todo no se pierde: arranca apenas esté listo -->
  <script>addEventListener('pointerdown', () => (window.__early = true), { once: true });</script>
  <script src="https://unpkg.com/@strudel/repl@1.3.0/dist/index.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
